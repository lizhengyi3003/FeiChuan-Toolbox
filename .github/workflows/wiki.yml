name: Wiki
on:
  push:
    branches: [main]
    paths: ['docs/wiki/**', '.github/workflows/wiki.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wiki
  cancel-in-progress: false
jobs:
  sync:
    name: Sync versioned documentation to Wiki
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync curated Wiki pages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = 'AUTHORIZATION: basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes('x-access-token:' + $env:GH_TOKEN))
          $wiki = Join-Path $env:RUNNER_TEMP 'project-wiki'
          git clone ('https://github.com/' + $env:REPOSITORY + '.wiki.git') $wiki
          if ($LASTEXITCODE) { throw 'Wiki must first be initialized on GitHub; versioned pages remain in docs/wiki.' }
          Copy-Item -Path docs/wiki/*.md -Destination $wiki
          git -C $wiki config user.name 'github-actions[bot]'
          git -C $wiki config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C $wiki add --all
          git -C $wiki diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git -C $wiki commit -m 'docs: sync reviewed wiki pages'
          if ($LASTEXITCODE) { throw 'Wiki commit failed.' }
          git -C $wiki push
          if ($LASTEXITCODE) { throw 'Wiki push failed.' }
